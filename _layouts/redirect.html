<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Opening the lab app</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="{{ page.redirect.to | escape }}">
  <script>
    const target = new URL(document.querySelector('link[rel=canonical]').href);
    target.search = location.search;
    target.hash = location.hash;
    location.replace(target.href);
  </script>
  <noscript><meta http-equiv="refresh" content="0; url={{ page.redirect.to | escape }}"></noscript>
</head>
<body><a href="{{ page.redirect.to | escape }}">Open the app</a></body>
</html>
